# ==========================================
# KITTY // PURPLE CYBERPUNK
# ==========================================

# FONT
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13

# ==========================================
# BACKGROUND AND TEXT
# ==========================================


hide_window_decorations yes

# ==========================================
# BORDERS
# ==========================================

window_border_width 1.5pt

# ==========================================
# CURSOR
# ==========================================

cursor_beam_thickness 1.5

# ==========================================
# SELECTION
# ==========================================


# ==========================================
# NORMAL COLORS
# ==========================================


# ==========================================
# BRIGHT COLORS
# ==========================================


# ==========================================
# SCROLLBACK AND BEHAVIOR
# ==========================================

scrollback_lines 10000

enable_audio_bell no
confirm_os_window_close 0

# Controle remoto apenas dentro do Kitty
allow_remote_control password
remote_control_password "" ls launch

# ARCH DASHBOARD

# Painéis sem bordas internas
draw_minimal_borders no


# PURPLE CYBERPUNK // VISUAL
background #291B36
foreground #D9F5FF

background_opacity 0.60
dynamic_background_opacity yes

cursor #C084FC
cursor_text_color #071522
cursor_shape beam
cursor_blink_interval 0.65

selection_background #68408A
selection_foreground #FFFFFF

active_border_color #A855F7
inactive_border_color #392052
bell_border_color #D8B4FE

window_padding_width 16

# PALETA NEON
color0  #071522
color1  #FF7D91
color2  #65DDB8
color3  #F0D38A
color4  #A855F7
color5  #B39AFF
color6  #C084FC
color7  #D9F5FF

color8  #456276
color9  #FFA1AD
color10 #93F0D2
color11 #FFE4A6
color12 #C084FC
color13 #D2B9FF
color14 #D8B4FE
color15 #FFFFFF
